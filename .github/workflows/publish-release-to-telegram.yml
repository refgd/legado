name: Publish release to Telegram

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish-to-telegram:
    name: Publish release assets and notes
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate Telegram secrets
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN secret"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing TELEGRAM_CHAT_ID secret"
            exit 1
          fi

      - name: Prepare release caption
        shell: bash
        run: |
          release_name="$(jq -r '.release.name // .release.tag_name' "$GITHUB_EVENT_PATH")"
          release_body="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH")"

          {
            printf '版本号：%s\n' "$release_name"
            printf '更新内容：\n'
            printf '%s\n\n' "$release_body"
            printf '#阅读 #Legado #阅读RU\n'
          } > telegram-caption.txt

      - name: Download APK release assets
        shell: bash
        run: |
          mkdir -p release-assets

          jq -r '
            .release.assets[]
            | select(.name | test("\\.apk$"; "i"))
            | [.name, .url]
            | @tsv
          ' "$GITHUB_EVENT_PATH" > apk-assets.tsv

          if [ ! -s apk-assets.tsv ]; then
            echo "No APK assets found on this release"
            exit 0
          fi

          while IFS=$'\t' read -r asset_name asset_url; do
            echo "Downloading ${asset_name}"
            curl --fail --location --show-error --silent \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/octet-stream" \
              "$asset_url" \
              --output "release-assets/${asset_name}"
          done < apk-assets.tsv

      - name: Send APKs to Telegram
        shell: bash
        run: |
          shopt -s nullglob
          apk_files=(release-assets/*.apk)

          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK files to send"
            exit 0
          fi

          for apk_file in "${apk_files[@]}"; do
            apk_name="$(basename "$apk_file")"
            echo "Sending ${apk_name}"
            curl --fail --show-error --silent \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form "chat_id=${TELEGRAM_CHAT_ID}" \
              --form "caption=<telegram-caption.txt" \
              --form "document=@${apk_file}"
          done
